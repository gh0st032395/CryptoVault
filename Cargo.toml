[workspace]
resolver = "3"
members = [
    "crates/cv-crypto",
    "crates/cv-format",
    "crates/cv-vault",
    "crates/cv-vfs",
    "crates/cv-ops",
    "crates/cv-session",
    "crates/cv-render",
    "crates/cv-cli",
    "crates/cv-desktop",
]
# Fuzzing needs nightly; `fuzz/` is its own workspace so the pinned stable
# toolchain here never has to know about it.
exclude = ["fuzz"]

# Metadata shared by every crate, so version and licence never drift apart.
[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.96"
license = "MIT OR Apache-2.0"
authors = ["CryptoVault contributors"]
repository = "https://github.com/gh0st032395/CryptoVault"
homepage = "https://github.com/gh0st032395/CryptoVault"
keywords = ["encryption", "vault", "privacy", "cryptography"]
categories = ["cryptography", "filesystem"]

[workspace.dependencies]
# Internal crates. Dependencies flow one way only:
#   cv-cli ──┐
#            ├─> cv-ops ─> cv-vfs ─> cv-vault ─> cv-format ─> cv-crypto
#   Tauri  ──┘
# Nothing below cv-ops is allowed to know that a GUI exists.
cv-crypto = { path = "crates/cv-crypto", version = "0.1.0" }
cv-format = { path = "crates/cv-format", version = "0.1.0" }
cv-vault = { path = "crates/cv-vault", version = "0.1.0" }
cv-vfs = { path = "crates/cv-vfs", version = "0.1.0" }
cv-ops = { path = "crates/cv-ops", version = "0.1.0" }
cv-session = { path = "crates/cv-session", version = "0.1.0" }

# Third-party. Kept deliberately small: in a security tool every dependency is
# code you are asking your users to trust.
thiserror = "2.0"

# Cryptography, all from the RustCrypto project.
#
# These versions are chosen as a *coherent generation* — every one of them builds
# on `aead` 0.5 and `digest` 0.10 — rather than by taking the newest release of
# each crate individually. Mixing generations would pull two copies of the trait
# crates into the tree, which means two copies of the code doing the actual
# cryptography. Newest is not a virtue here; agreeing with each other is.
aes-gcm = "0.10"              # AES-256-GCM, the default content cipher
chacha20poly1305 = "0.10"     # XChaCha20-Poly1305, the alternative (alg_id 0x02)
aes-siv = "0.7"               # Deterministic AEAD for filenames
argon2 = "0.5"                # Password-based key derivation
hkdf = "0.12"                 # Sub-key derivation from the master seed
hmac = "0.12"                 # Config authentication and directory placement
sha2 = "0.10"
rand = "0.8"                  # OsRng only; no user-visible randomness is seeded
subtle = "2.6"                # Constant-time comparison
zeroize = { version = "1.8", features = ["derive"] }

# Serialisation of the on-disk format.
ciborium = "0.2"              # CBOR: compact, self-describing, one parser to fuzz
serde = { version = "1.0", features = ["derive"] }
serde_bytes = "0.11"          # CBOR byte strings, rather than arrays of integers
data-encoding = "2.6"         # base64url for names, base32 for directory hashes

# The desktop application.
#
# Tauri rather than Electron: the window is the operating system's own webview,
# so the application ships a few megabytes of Rust instead of a browser, and the
# part that touches vaults is Rust that the rest of this workspace already
# tests. `config-json5` buys the one thing a plain `.json` config cannot have —
# comments — and the file it applies to contains the content security policy,
# which is not a line anyone should have to guess the reasoning behind.
tauri = { version = "2", features = ["config-json5"] }
tauri-build = { version = "2", features = ["config-json5"] }
# The system folder picker. Choosing where a vault lives is the one thing the
# interface genuinely cannot do for itself: a typed path is a typo away from a
# vault in the wrong place, and `~` is a shell convention, not a directory.
tauri-plugin-dialog = "2"
# Where the platform keeps an application's own files. Tauri knows this too, but
# only once an application is running — and the vault list has to be read before
# that, because a failure inside Tauri's setup hook is a panic rather than an
# error. Already in the tree underneath Tauri, so it costs nothing new.
dirs = "6"

# Test-only.
tempfile = "3.10"             # throwaway vaults for integration tests
# The shape of what crosses to the interface is a contract, so it is asserted
# rather than assumed. Already in the tree by way of Tauri; test-only here.
serde_json = "1.0"

# Lints applied to every crate in the workspace. These are conditions of merge,
# not suggestions; CI runs with warnings denied.
[workspace.lints.rust]
missing_docs = "deny"
# Unused code is either a leftover or a mistake, and in a crate that handles key
# material an unused variable is often a value someone meant to wipe.
unused = { level = "deny", priority = -1 }
missing_debug_implementations = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }
unreachable_pub = "warn"
# `deny` rather than `forbid`: a handful of call sites (memory locking, platform
# APIs) will legitimately need `unsafe`. Each one must opt in explicitly with an
# `#[allow(unsafe_code)]` carrying a comment that justifies it.
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "deny", priority = -1 }
pedantic = { level = "warn", priority = -1 }
# Documentation here is deliberately prose: it explains *why* a design is what it
# is, and it names products (CryptoVault, Cryptera, WinFsp, OneDrive) constantly.
# Backticking every proper noun would make that prose harder to read, not easier.
doc_markdown = "allow"
# A panic in a vault is data the user cannot reach any more. Error paths are
# handled, never assumed away. Tests opt out of these locally.
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
todo = "warn"
unimplemented = "warn"
# Silent truncation in offset and chunk-index arithmetic would be a correctness
# bug in the file format, so make the compiler point it out.
cast_possible_truncation = "deny"
cast_sign_loss = "deny"
cast_possible_wrap = "deny"

[workspace.lints.rustdoc]
broken_intra_doc_links = "deny"
private_intra_doc_links = "warn"

# Release builds: optimise, but keep overflow checks on. A wrapped integer in
# chunk arithmetic must abort, never silently address the wrong block.
[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
panic = "abort"
strip = "symbols"
overflow-checks = true

# Argon2id is unusable at interactive speed in a debug build, so the KDF and the
# ciphers are always optimised, even while developing.
[profile.dev.package."*"]
opt-level = 2
