# Dependency updates.
#
# Weekly rather than daily: in a project whose dependency list is deliberately
# short, a daily cadence produces noise rather than safety. Security advisories
# are caught separately and immediately by cargo-audit on every CI run.

version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore"
      include: scope
    labels:
      - dependencies

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore"
    labels:
      - dependencies
      - ci
