# The gate on every push and pull request: one job, one runner, fast.
#
# It used to be seven jobs across three operating systems. That was thorough and
# unusable: seven jobs all queue for their own runner, and on a busy day the
# result arrived twenty minutes later — or not at all, because a job that never
# starts eventually gets cancelled. A check nobody waits for is not a check.
#
# So the everyday loop is a single Ubuntu job that runs exactly what
# `scripts/check.sh` runs locally, plus the interface. Windows and macOS, which
# are the scarce and slow runners, moved to `cross-platform.yml`: on merges to
# main, nightly, and on demand.
#
# The trade is real and worth stating: a pull request no longer proves Windows
# and macOS before it merges. It is recorded as R-20. For a project where main
# is itself gated and a break is caught within minutes of landing, a fast gate
# people actually read beats a thorough one they learn to ignore.
#
# Only first-party actions, pinned to v4 — the version cached on every runner.
# The newer majors repeatedly failed to resolve at "Set up job" with an internal
# error on GitHub's side (R-19).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Runs queue rather than cancel each other: `cancel-in-progress: true` made
# re-running failed jobs cancel its own jobs, which is indistinguishable from a
# real failure.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  check:
    name: Check
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            target
          key: check-${{ hashFiles('**/Cargo.lock', 'rust-toolchain.toml') }}
          restore-keys: check-

      - name: Toolchain
        run: rustc --version && cargo --version

      # Tauri builds against the system webview. On Linux that is WebKitGTK,
      # which is not on the runner image; on Windows and macOS the webview ships
      # with the operating system and there is nothing to install.
      - name: System libraries for the desktop build
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libwebkit2gtk-4.1-dev \
            libjavascriptcoregtk-4.1-dev \
            libsoup-3.0-dev \
            libgtk-3-dev \
            librsvg2-dev \
            patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: ui/package-lock.json

      # `ci` rather than `install`: it installs exactly the lockfile and fails if
      # the two have drifted, which is the point of committing one.
      - name: Interface — install
        working-directory: ui
        run: npm ci

      - name: Interface — types and Svelte checks
        working-directory: ui
        run: npm run check

      # Before the cargo steps, because `cv-desktop` embeds `ui/dist` at compile
      # time: without it, clippy and the tests fail on a clean checkout.
      - name: Interface — build
        working-directory: ui
        run: npm run build

      - name: Formatting
        run: cargo fmt --all -- --check

      - name: Lints
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Tests
        run: cargo test --workspace --all-features

      - name: Documentation
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --workspace --no-deps --all-features

      # Cheap structural checks. Inline rather than a job of their own: they take
      # under a second and are not worth a runner.
      - name: No vaults or key material committed
        run: |
          # The frozen format vectors are the one deliberate exception: test data
          # under keys published in the test source, committed so that a format
          # change cannot happen quietly.
          if git ls-files \
            | grep -v '^crates/cv-format/tests/vectors/' \
            | grep -E '\.(cvf|cvd|cvn|cvarchive|key|pem|p12|pfx)$|(^|/)vault\.cvconf$'; then
            echo "::error::Encrypted vault files or key material are committed"
            exit 1
          fi

      - name: Both manual languages have the same chapters
        run: |
          it=$(find docs/manual/it -name '*.md' | wc -l)
          en=$(find docs/manual/en -name '*.md' | wc -l)
          if [ "$it" -ne "$en" ]; then
            echo "::error::The manual has $it Italian files and $en English ones"
            exit 1
          fi

