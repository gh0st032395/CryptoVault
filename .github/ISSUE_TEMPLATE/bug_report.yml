name: 🐛 Bug report
description: Something behaves differently from how it is documented
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        **Not for security issues.** Anything affecting the confidentiality or
        integrity of user data goes through
        [private reporting](https://github.com/gh0st032395/CryptoVault/security/advisories/new).

        **Never paste a password, a recovery key, or the contents of a vault
        file into an issue.** Log excerpts are fine; check them first.

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what happened, and what you expected instead.
      placeholder: |
        1. I opened a vault stored in my Dropbox folder
        2. I added a 2 GB video
        3. The progress bar reached 100% and stayed there
        Expected: the import to finish.
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: Version or commit
      description: From `cryptovault --version`, or the commit you built.
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true

  - type: dropdown
    id: storage
    attributes:
      label: Where the vault is stored
      description: >-
        Cloud sync is the source of a whole class of problems that never appear
        on a local disk, so this matters more than it looks.
      options:
        - Local disk
        - Dropbox
        - iCloud Drive
        - Google Drive
        - OneDrive
        - Network drive or NAS
        - External or removable drive
        - Other
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: Does it happen again?
      description: >-
        Every time, sometimes, or once? An intermittent bug is still worth
        reporting — say so rather than waiting until you can reproduce it.

  - type: textarea
    id: extra
    attributes:
      label: Anything else
      description: Log excerpts, screenshots, file sizes, vault size, whatever seems relevant.

  - type: checkboxes
    id: confirmations
    attributes:
      label: Before submitting
      options:
        - label: This is not a security vulnerability (those go through private reporting)
          required: true
        - label: I have not included any password, key, or vault content
          required: true
