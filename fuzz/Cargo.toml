[package]
name = "cv-fuzz"
version = "0.0.0"
publish = false
edition = "2024"
license = "MIT OR Apache-2.0"

# Its own workspace on purpose. Fuzzing needs a nightly toolchain, and the main
# workspace is pinned to a stable one; keeping them separate means `cargo build`
# at the repository root never drags nightly-only machinery in.
[workspace]
members = ["."]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
cv-crypto = { path = "../crates/cv-crypto" }
cv-format = { path = "../crates/cv-format" }

[profile.release]
debug = true
overflow-checks = true

[[bin]]
name = "header"
path = "fuzz_targets/header.rs"
test = false
doc = false
bench = false

[[bin]]
name = "chunk"
path = "fuzz_targets/chunk.rs"
test = false
doc = false
bench = false

[[bin]]
name = "config"
path = "fuzz_targets/config.rs"
test = false
doc = false
bench = false

[[bin]]
name = "name"
path = "fuzz_targets/name.rs"
test = false
doc = false
bench = false
