# cargo-deny configuration.
#
# In a security tool the dependency tree is part of the attack surface: every
# crate here is code we are asking users to trust with their files. This file is
# how that trust is kept deliberate rather than accidental.

[graph]
targets = [
    { triple = "x86_64-unknown-linux-gnu" },
    { triple = "x86_64-pc-windows-msvc" },
    { triple = "x86_64-apple-darwin" },
    { triple = "aarch64-apple-darwin" },
]
all-features = true

[advisories]
version = 2
# No blanket ignores. An advisory that genuinely does not apply gets its ID
# listed here together with a comment saying why, and gets revisited.
ignore = []

[licenses]
version = 2
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
]
confidence-threshold = 0.93
# The allow list is written for the dependency tree we expect, not only the one
# we have today. Listing a licence we have not encountered yet is intentional.
unused-allowed-license = "allow"

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Crates that must never enter the tree.
deny = [
    # Cryptography comes from the RustCrypto stack, which is auditable Rust and
    # needs no C toolchain. Pulling in OpenSSL would add a large C dependency and
    # a packaging headache on three platforms for no benefit.
    { name = "openssl" },
    { name = "openssl-sys" },
    # `time` 0.1 has a known unsoundness and is only ever pulled in transitively.
    { name = "time", version = "<0.2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
